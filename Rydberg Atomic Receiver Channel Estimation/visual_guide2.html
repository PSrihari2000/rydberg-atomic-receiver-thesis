<div class="card">
<div class="kicker">PART B</div>
<div class="title">Why the channel is low-rank, and how that becomes an optimization constraint</div>
<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrS2" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5.5,2.5 L0,5 Z" fill="#8A93A3"/></marker>
</defs>

<text x="30" y="34" fill="#9B7FD4" font-family="IBM Plex Mono" font-size="12" letter-spacing="0.5">STEP 1 — WHY THE PHYSICS FORCES LOW RANK</text>

<rect x="30" y="52" width="330" height="80" rx="5" fill="#12161F" stroke="#2A3040"/>
<text x="46" y="76" fill="#ECEAE2" font-family="STIX Two Text" font-style="italic" font-size="13">each path's phase factors apart:</text>
<text x="46" y="100" fill="#9B7FD4" font-family="STIX Two Text" font-style="italic" font-size="13">e<tspan baseline-shift="super" font-size="9">−j(i₁−1)u</tspan> · e<tspan baseline-shift="super" font-size="9">−j(i₂−1)v</tspan></text>
<text x="46" y="120" fill="#6C7383" font-family="IBM Plex Sans" font-size="10.5">an i₁-only factor times an i₂-only factor</text>

<line x1="195" y1="132" x2="195" y2="160" stroke="#8A93A3" stroke-width="1.4" marker-end="url(#arrS2)"/>

<rect x="30" y="160" width="330" height="70" rx="5" fill="#12161F" stroke="#9B7FD4" stroke-width="1.4"/>
<text x="46" y="184" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12">that's exactly an outer product —</text>
<text x="46" y="202" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12">one column pattern × one row pattern</text>

<line x1="195" y1="230" x2="195" y2="258" stroke="#8A93A3" stroke-width="1.4" marker-end="url(#arrS2)"/>

<rect x="30" y="258" width="330" height="80" rx="5" fill="#1C2230" stroke="#9B7FD4" stroke-width="1.6"/>
<text x="46" y="282" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12">sum L<tspan baseline-shift="sub" font-size="8">k</tspan> paths = sum of L<tspan baseline-shift="sub" font-size="8">k</tspan> such rank-1 terms</text>
<text x="46" y="306" fill="#9B7FD4" font-family="STIX Two Text" font-style="italic" font-size="15">rank( 𝒢<tspan baseline-shift="sub" font-size="10">:,:,k</tspan> ) ≤ L<tspan baseline-shift="sub" font-size="10">k</tspan></text>
<text x="46" y="325" fill="#6C7383" font-family="IBM Plex Sans" font-size="10.5">a physical fact, true for every user k</text>

<text x="30" y="374" fill="#6C7383" font-family="IBM Plex Sans" font-size="11">No 1D analogue: a plain vector (1D channel) has no</text>
<text x="30" y="392" fill="#6C7383" font-family="IBM Plex Sans" font-size="11">"rank &gt; 1" concept — this structure only exists in 2D.</text>

<line x1="410" y1="20" x2="410" y2="500" stroke="#2A3040"/>

<text x="440" y="34" fill="#57B894" font-family="IBM Plex Mono" font-size="12" letter-spacing="0.5">STEP 2 — TURNING THAT FACT INTO A CONSTRAINT</text>

<rect x="440" y="52" width="730" height="76" rx="5" fill="#12161F" stroke="#2A3040"/>
<text x="456" y="72" fill="#6C7383" font-family="IBM Plex Mono" font-size="11">Eq. (21) — the estimation problem, with the fact built in</text>
<text x="456" y="96" fill="#ECEAE2" font-family="STIX Two Text" font-style="italic" font-size="13.5">min<tspan baseline-shift="sub" font-size="9">G(3)</tspan>&#160;&#160;‖Y<tspan baseline-shift="sub" font-size="9">(3)</tspan>−B<tspan baseline-shift="sub" font-size="9">(3)</tspan>−Re(Z<tspan baseline-shift="sub" font-size="9">(3)</tspan>∘(S<tspan baseline-shift="super" font-size="9">T</tspan>G<tspan baseline-shift="sub" font-size="9">(3)</tspan>))‖<tspan baseline-shift="sub" font-size="9">F</tspan><tspan baseline-shift="super" font-size="9">2</tspan></text>
<text x="456" y="116" fill="#57B894" font-family="STIX Two Text" font-style="italic" font-size="13.5">s.t.&#160;&#160;rank( mat([G<tspan baseline-shift="sub" font-size="9">(3)</tspan>]<tspan baseline-shift="sub" font-size="9">k,:</tspan>) ) ≤ L<tspan baseline-shift="sub" font-size="9">k</tspan>&#160;&#160;∀k</text>

<rect x="440" y="138" width="730" height="60" rx="5" fill="#12161F" stroke="#2A3040"/>
<text x="456" y="158" fill="#6C7383" font-family="IBM Plex Mono" font-size="11">the feasible set — every matrix allowed to be a candidate answer</text>
<text x="456" y="184" fill="#57B894" font-family="STIX Two Text" font-style="italic" font-size="14">𝒳 = { X ∈ ℝ<tspan baseline-shift="super" font-size="9">K×I₁I₂</tspan>&#160;&#160;:&#160;&#160;rank(mat([X]<tspan baseline-shift="sub" font-size="9">k,:</tspan>)) ≤ L<tspan baseline-shift="sub" font-size="9">k</tspan>, ∀k }</text>

<rect x="440" y="210" width="730" height="66" rx="5" fill="#12161F" stroke="#2A3040"/>
<text x="456" y="230" fill="#6C7383" font-family="IBM Plex Mono" font-size="11">the projection — snap any matrix onto the nearest point in 𝒳</text>
<text x="456" y="256" fill="#ECEAE2" font-family="STIX Two Text" font-style="italic" font-size="14">proj<tspan baseline-shift="sub" font-size="9">𝒳</tspan>(M) = arg min<tspan baseline-shift="sub" font-size="9">X</tspan> ‖X − M‖<tspan baseline-shift="sub" font-size="9">F</tspan><tspan baseline-shift="super" font-size="9">2</tspan>&#160;&#160;s.t.&#160;&#160;X ∈ 𝒳</text>

<rect x="440" y="292" width="730" height="130" rx="5" fill="#1C2230" stroke="#57B894" stroke-width="1.6"/>
<text x="456" y="316" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12.5" font-weight="600">Why this constraint set is easy to project onto</text>
<text x="456" y="340" fill="#A7AEBB" font-family="IBM Plex Sans" font-size="12">Row k's constraint only mentions row k — so the projection</text>
<text x="456" y="360" fill="#A7AEBB" font-family="IBM Plex Sans" font-size="12">separates into K independent, one-user-at-a-time problems.</text>
<text x="456" y="384" fill="#A7AEBB" font-family="IBM Plex Sans" font-size="12">Each one is solved exactly by the Eckart–Young–Mirsky theorem:</text>
<text x="456" y="404" fill="#57B894" font-family="STIX Two Text" font-style="italic" font-size="13">SVD row k's I₁×I₂ matrix, keep only its top L<tspan baseline-shift="sub" font-size="9">k</tspan> singular values</text>

<text x="440" y="450" fill="#6C7383" font-family="IBM Plex Sans" font-size="11">This is the one thing the classical Gerchberg–Saxton algorithm cannot do — GS only ever</text>
<text x="440" y="468" fill="#6C7383" font-family="IBM Plex Sans" font-size="11">projects entry-by-entry onto a magnitude constraint; a rank constraint needs the whole matrix at once.</text>

</svg>

<div class="title">The PGD optimization loop — what happens in every box, once per iteration</div>
<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrS4" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto"><path d="M0,0 L5.5,2.5 L0,5 Z" fill="#8A93A3"/></marker>

</defs>

<text x="30" y="30" fill="#6C7383" font-family="IBM Plex Mono" font-size="11.5">the main loop — Algorithm 1 in the paper. one pass = one iteration t → t+1.</text>

<rect x="30" y="50" width="255" height="92" rx="5" fill="#1C2230" stroke="#4A93E0" stroke-width="1.6"/>
<text x="46" y="76" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12.5" font-weight="600">① Initialize G⁰₍₃₎</text>
<text x="46" y="96" fill="#A7AEBB" font-family="IBM Plex Sans" font-size="11">entries drawn i.i.d. CN(0, 0.1)</text>
<text x="46" y="114" fill="#6C7383" font-family="IBM Plex Sans" font-size="10.5">a random, rank-unaware starting</text>
<text x="46" y="130" fill="#6C7383" font-family="IBM Plex Sans" font-size="10.5">guess for all K users at once; t = 0</text>

<line x1="285" y1="96" x2="325" y2="96" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#arrS4)"/>

<rect x="325" y="50" width="255" height="92" rx="5" fill="#1C2230" stroke="#E1573F" stroke-width="1.6"/>
<text x="341" y="76" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12.5" font-weight="600">② Gradient step</text>
<text x="341" y="96" fill="#A7AEBB" font-family="STIX Two Text" font-style="italic" font-size="12.5">M = G<tspan baseline-shift="super" font-size="8">t</tspan> − ζ<tspan baseline-shift="sub" font-size="8">t</tspan>∇f(G<tspan baseline-shift="super" font-size="8">t</tspan>)</text>
<text x="341" y="114" fill="#6C7383" font-family="IBM Plex Sans" font-size="10.5">Eq. (24) — moves every entry</text>
<text x="341" y="130" fill="#6C7383" font-family="IBM Plex Sans" font-size="10.5">downhill on the data-fit error; ignores rank</text>

<line x1="580" y1="96" x2="620" y2="96" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#arrS4)"/>

<rect x="620" y="50" width="255" height="92" rx="5" fill="#1C2230" stroke="#E3AC3C" stroke-width="1.6"/>
<text x="636" y="76" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12.5" font-weight="600">③ Projection step</text>
<text x="636" y="96" fill="#A7AEBB" font-family="IBM Plex Sans" font-size="11.5">for k = 1…K: truncate row k of M</text>
<text x="636" y="114" fill="#6C7383" font-family="IBM Plex Sans" font-size="10.5">to rank L<tspan baseline-shift="sub" font-size="7">k</tspan> — restores the physical</text>
<text x="636" y="130" fill="#6C7383" font-family="IBM Plex Sans" font-size="10.5">structure step ② just broke — zoomed in below</text>

<line x1="875" y1="96" x2="915" y2="96" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#arrS4)"/>

<rect x="915" y="50" width="255" height="92" rx="5" fill="#1C2230" stroke="#57B894" stroke-width="1.6"/>
<text x="931" y="76" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12.5" font-weight="600">④ Check convergence</text>
<text x="931" y="96" fill="#A7AEBB" font-family="STIX Two Text" font-style="italic" font-size="11.5">‖G<tspan baseline-shift="super" font-size="7">t+1</tspan>−G<tspan baseline-shift="super" font-size="7">t</tspan>‖<tspan baseline-shift="sub" font-size="7">F</tspan><tspan baseline-shift="super" font-size="7">2</tspan> &lt; ε ?</text>
<text x="931" y="114" fill="#6C7383" font-family="IBM Plex Sans" font-size="10.5">how much did this pass actually</text>
<text x="931" y="130" fill="#6C7383" font-family="IBM Plex Sans" font-size="10.5">change G? no → t=t+1, loop · yes → return</text>

<path d="M915,96 C 700,196 500,196 285,136" fill="none" stroke="#6C7383" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrS4)"/>
<text x="600" y="188" text-anchor="middle" fill="#6C7383" font-family="IBM Plex Sans" font-size="11">not yet converged — repeat ② gradient + ③ projection</text>

<line x1="30" y1="212" x2="1170" y2="212" stroke="#2A3040"/>
<text x="30" y="240" fill="#E3AC3C" font-family="IBM Plex Mono" font-size="12" letter-spacing="0.5">ZOOMING INTO ③ "PROJECTION STEP" — WHAT HAPPENS TO ONE ROW k</text>

<rect x="20" y="262" width="222" height="88" rx="5" fill="#12161F" stroke="#2A3040"/>
<text x="34" y="286" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12" font-weight="600">a) take row k of M</text>
<text x="34" y="306" fill="#A7AEBB" font-family="STIX Two Text" font-style="italic" font-size="12">[M]<tspan baseline-shift="sub" font-size="8">k,:</tspan> — a flat list</text>
<text x="34" y="324" fill="#6C7383" font-family="IBM Plex Sans" font-size="10">length I₁I₂, still just</text>
<text x="34" y="340" fill="#6C7383" font-family="IBM Plex Sans" font-size="10">numbers, no shape yet</text>

<line x1="242" y1="300" x2="294" y2="300" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#arrS4)"/>
<text x="268" y="281" text-anchor="middle" fill="#6C7383" font-family="IBM Plex Sans" font-size="9.5">reshape</text>

<rect x="294" y="262" width="210" height="88" rx="5" fill="#12161F" stroke="#4A93E0" stroke-width="1.6"/>
<text x="308" y="286" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12" font-weight="600">b) fold into a grid</text>
<text x="308" y="306" fill="#A7AEBB" font-family="STIX Two Text" font-style="italic" font-size="12">mat([M]<tspan baseline-shift="sub" font-size="8">k,:</tspan>)</text>
<text x="308" y="324" fill="#6C7383" font-family="IBM Plex Sans" font-size="10">back to user k's native</text>
<text x="308" y="340" fill="#6C7383" font-family="IBM Plex Sans" font-size="10">I₁ × I₂ shape</text>

<line x1="504" y1="300" x2="556" y2="300" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#arrS4)"/>
<text x="530" y="281" text-anchor="middle" fill="#6C7383" font-family="IBM Plex Sans" font-size="9.5">SVD</text>

<rect x="556" y="262" width="222" height="88" rx="5" fill="#12161F" stroke="#9B7FD4" stroke-width="1.6"/>
<text x="570" y="286" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12" font-weight="600">c) factor it</text>
<text x="570" y="306" fill="#9B7FD4" font-family="STIX Two Text" font-style="italic" font-size="13">U<tspan baseline-shift="sub" font-size="8">k</tspan>Σ<tspan baseline-shift="sub" font-size="8">k</tspan>V<tspan baseline-shift="sub" font-size="8">k</tspan><tspan baseline-shift="super" font-size="8">T</tspan> = svd(·)</text>
<text x="570" y="324" fill="#6C7383" font-family="IBM Plex Sans" font-size="10">Eq. (26) — Σ<tspan baseline-shift="sub" font-size="7">k</tspan> lists how much</text>
<text x="570" y="340" fill="#6C7383" font-family="IBM Plex Sans" font-size="10">each "direction" contributes</text>

<line x1="778" y1="300" x2="830" y2="300" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#arrS4)"/>
<text x="804" y="281" text-anchor="middle" fill="#6C7383" font-family="IBM Plex Sans" font-size="9.5">truncate</text>

<rect x="830" y="262" width="230" height="88" rx="5" fill="#12161F" stroke="#57B894" stroke-width="1.6"/>
<text x="844" y="286" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12" font-weight="600">d) keep top L<tspan baseline-shift="sub" font-size="8">k</tspan> only</text>
<text x="844" y="306" fill="#57B894" font-family="STIX Two Text" font-style="italic" font-size="12.5">Ũ<tspan baseline-shift="sub" font-size="8">k</tspan>Σ̃<tspan baseline-shift="sub" font-size="8">k</tspan>Ṽ<tspan baseline-shift="sub" font-size="8">k</tspan><tspan baseline-shift="super" font-size="8">T</tspan> — Eq. (27)</text>
<text x="844" y="324" fill="#6C7383" font-family="IBM Plex Sans" font-size="10">drop the smallest directions,</text>
<text x="844" y="340" fill="#6C7383" font-family="IBM Plex Sans" font-size="10">multiply the kept ones back together</text>

<path d="M945,350 C 945,392 490,392 130,392 C 30,392 30,368 30,350" fill="none" stroke="#8A93A3" stroke-width="1.4" marker-end="url(#arrS4)"/>
<text x="490" y="416" text-anchor="middle" fill="#6C7383" font-family="IBM Plex Sans" font-size="11">e) vec(·)ᵀ flattens it back → this becomes the new row k of G<tspan baseline-shift="super" font-size="8">t+1</tspan>₍₃₎</text>

<rect x="30" y="436" width="1040" height="90" rx="5" fill="#1C2230" stroke="#57B894" stroke-width="1.6"/>
<text x="46" y="460" fill="#ECEAE2" font-family="IBM Plex Sans" font-size="12.5" font-weight="600">Why step d) is the exact answer, not an approximation</text>
<text x="46" y="482" fill="#A7AEBB" font-family="IBM Plex Sans" font-size="12">Eckart–Young–Mirsky guarantees: among <tspan fill="#ECEAE2">every</tspan> possible rank-L<tspan baseline-shift="sub" font-size="8">k</tspan> matrix, keeping the top L<tspan baseline-shift="sub" font-size="8">k</tspan> singular</text>
<text x="46" y="502" fill="#A7AEBB" font-family="IBM Plex Sans" font-size="12">values and vectors, discarding the rest is <tspan fill="#ECEAE2">provably</tspan> the closest one to M — no search needed, one SVD settles it.</text>

<text x="30" y="556" fill="#6C7383" font-family="IBM Plex Sans" font-size="11">Runs independently for k = 1, …, K (Part B, Step 2: row k's constraint only involves row k) — K small SVDs each iteration, never one huge coupled problem.</text>
